 setArms(p,cw,wf,wl,wg,sw,T);
 p.legs.forEach((l,j)=>l.rotation.x=(j?-sw:sw)*.9);
 p.th.visible=T>p.tD+1.2;
 if(p.lota){const on=wl>.7;p.lota.visible=p.stream.visible=on;
  if(on){const A=p.stream.geometry.attributes.position,wy=-p.g.position.y;
   for(let q=0;q<14;q++){const u=(T*.9+q/14)%1,v=1-u;A.setXYZ(q,v*v*.05+2*v*u*.5+u*u*.95,v*v*2.2+2*v*u*2.25+u*u*wy,v*v*-.3+2*v*u*-.75+u*u*-1.1)}A.needsUpdate=true}}
 const th=p.ry,hx=p.g.position.x-.26*Math.sin(th),hz=p.g.position.z-.26*Math.cos(th),hy=p.g.position.y+2.2;
 p.bk.position.set(L(p.bx+.95,hx,cw),L(.53,hy,cw),L(p.bz+.15,hz,cw));p.bk.rotation.x=-.3*cw*inW;
 p.mt.scale.x=Math.max(.001,st(p.t1e+.3,p.t1e+3));
 const inWater=T>p.tB-.5&&T<p.tC+.5;
 rings[n].forEach((m,j)=>{const q=(T*.35+j*.5)%1;m.visible=inWater;m.position.set(x,.04,z);m.scale.setScalar(.3+q*1.1);m.material.opacity=.45*(1-q)})}

/* floating diyas + dust */
const bowlG=new T3.SphereGeometry(.2,10,6,0,6.283,Math.PI/2,Math.PI/2),bowlM=mat(0xc76a2b,.8,.15);
const diyas=[...Array(28)].map(()=>{const g=new T3.Group();g.add(new T3.Mesh(bowlG,bowlM));const z=-R(3,45),s=Math.min(1.4,1+(-z)*.018);glow(0xffb347,.9*s,0,.28,0,.95,g);glow(0xfff2c0,.35*s,0,.24,0,1,g);g.position.set(R(-40,40),0,z);g.scale.setScalar(s);sc.add(g);return {g,p:R(0,6),v:R(.1,.25)}});
const dg=new T3.BufferGeometry(),dp=new Float32Array(300);for(let i=0;i<100;i++)dp.set([R(-20,20),R(.5,9),R(-12,16)],i*3);dg.setAttribute('position',new T3.BufferAttribute(dp,3));
sc.add(Object.assign(new T3.Points(dg,new T3.PointsMaterial({size:.16,map:glowT,color:0xffd9a0,blending:T3.AdditiveBlending,transparent:true,depthWrite:false,opacity:.8})),{frustumCulled:false}));

/* story chapters + camera */
const CAP=[['सुबह की पहली रोशनी… घाट की ओर','Morning light · the walk to the ghat'],['घाट पर तैयारी: चटाई, सूप और दउरा','Preparing at the riverbank'],['सूर्य देव को अर्घ्य','Arghya, standing in the river'],['ठेकुआ का प्रसाद, मुस्कुराहटें और वापसी','Sharing thekua · returning home']];
const CT=[0,10,18,34],cams=[{p:[0,2.6,15],l:[0,2,3]},{p:[1,2.5,12.8],l:[0,1.5,5.8]},{p:[.5,1.9,3.8],l:[0,2.2,-6]},{p:[0,2.4,15],l:[0,1.5,5.2]}];
const dots=[...document.querySelectorAll('#dots span')],capEl=$('cap');
let T=0,ch=-1,rvOn=false,END=57;
function setCap(c){if(rvOn)return;capEl.style.opacity=0;setTimeout(()=>{if(rvOn)return;capEl.innerHTML='<b>'+CAP[c][0]+'</b><i>'+CAP[c][1]+'</i>';capEl.style.opacity=1},350);dots.forEach((d,i)=>d.classList.toggle('on',i==c))}
function restart(t){T=t;ch=-1;rvOn=false;$('rv').classList.remove('on')}
dots.forEach((d,i)=>d.addEventListener('click',e=>{e.stopPropagation();restart(CT[i]+.01)}));
$('rv').addEventListener('click',()=>{if(T>END+4)restart(0)});
$('hp').innerHTML='Happy Chhath Puja'.split('').map((c,i)=>`<span style="--i:${i}">${c==' '?'&nbsp;':c}</span>`).join('');
function size(){const w=innerWidth,h=innerHeight,a=w/h;rd.setSize(w,h);cam.aspect=a;cam.fov=a<1?68:52;cam.updateProjectionMatrix();cams[1].p[2]=a<1?15:12.8;cams[2].p[2]=a<1?6:3.8;cams[3].p[2]=a<1?16:15}
addEventListener('resize',size);size();
let tx=0,ty=0,px=0,py=0;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1});addEventListener('pointerdown',()=>wake());

/* devotional ambience (WebAudio, no files); tries to autoplay, starts on first tap if blocked */
let ac,mg,muted=false;
function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=ac.createGain();mg.gain.value=.9;mg.connect(ac.destination);
 const d=ac.createDelay();d.delayTime.value=.4;const fb=ac.createGain();fb.gain.value=.45;d.connect(fb);fb.connect(d);d.connect(mg);const wet=ac.createGain();wet.gain.value=.5;wet.connect(d);
 [[65.41,.4],[130.81,.5],[196,.35],[261.63,.22]].forEach(([f,v],i)=>{const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type=i?'sine':'triangle';o.frequency.value=f;o.detune.value=i*2-3;g.gain.value=v*.16;l.frequency.value=.15+i*.07;lg.gain.value=v*.07;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(mg);g.connect(wet);o.start();l.start()});
 const nt=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
 setInterval(()=>{if(muted||ac.state!=='running')return;[nt[Math.random()*8|0],Math.random()<.3?nt[Math.random()*8|0]:0].forEach(f=>{if(!f)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.09,n+.02);g.gain.exponentialRampToValueAtTime(.0005,n+2.6);o.connect(g);g.connect(mg);g.connect(wet);o.start(n);o.stop(n+2.8)})},1900)}
function wake(){audio();if(ac&&ac.state==='suspended')ac.resume()}
audio();if(ac)ac.resume().catch(()=>{});
['keydown','touchend','click'].forEach(ev=>addEventListener(ev,wake));
$('snd').addEventListener('click',e=>{e.stopPropagation();wake();muted=!muted;$('snd').classList.toggle('off',muted);if(mg)mg.gain.linearRampToValueAtTime(muted?0:.9,ac.currentTime+.6)});

/* main loop */
const look=V();let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 const c=T<CT[1]?0:T<CT[2]?1:T<CT[3]?2:3;if(c!==ch){ch=c;setCap(c)}
 if(T>=END&&!rvOn){rvOn=true;capEl.style.opacity=0;$('rv').classList.add('on')}
 const sy=L(2.6,8.6,S(T/45));SUN.y=sy;sunM.position.y=g1.position.y=g2.position.y=sy;sunDir.copy(SUN).normalize();dl.position.copy(sunDir).multiplyScalar(50);
 water.material.uniforms.t.value=T;
 people.forEach((p,n)=>updPerson(p,T,dt,n));
 diyas.forEach(d=>{d.g.position.x+=d.v*dt;if(d.g.position.x>45)d.g.position.x=-45;d.g.position.y=Math.sin(T*1.3+d.p)*.05});
 const A=dg.attributes.position;for(let i=0;i<100;i++){let y=dp[i*3+1]+dt*.12;if(y>9)y=.5;dp[i*3+1]=y;dp[i*3]+=Math.sin(T*.5+i)*dt*.1}A.needsUpdate=true;
 const k0=cams[Math.max(0,c-1)],k1=cams[c],kk=c?S((T-CT[c])/3.5):1;
 px=L(px,tx,.04);py=L(py,ty,.04);
 const pk=[0,1,2].map(i=>L(k0.p[i],k1.p[i],kk)),lk=[0,1,2].map(i=>L(k0.l[i],k1.l[i],kk));
 if(c==3){const pn=Math.sin((T-34)*.15)*(innerWidth<innerHeight?4:2.5);pk[0]+=pn;lk[0]+=pn}
 cam.position.set(pk[0]+px*.9,pk[1]+Math.sin(T*.4)*.05-py*.3,pk[2]);look.set(lk[0]+px*1.5,lk[1]-py*.4,lk[2]);cam.lookAt(look);
 rd.render(sc,cam)}
requestAnimationFrame(loop);
}
